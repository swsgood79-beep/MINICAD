services:
  - type: web
    name: minicad-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: MINICAD_DEPLOYED
        value: "1"
      - key: MINICAD_USERNAME
        value: minicad
      - key: MINICAD_PASSWORD
        generateValue: true
