name: Deploy MiniCAD to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: python scripts/prepare_browser.py
      - run: npm test
        working-directory: frontend
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: frontend
        env:
          VITE_CAD_MODE: browser
          VITE_CAD_REVISION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
