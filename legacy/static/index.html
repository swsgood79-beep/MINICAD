<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniCAD Web</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#e9eef6;background:#0f141c}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1c2531;flex-wrap:wrap;border-bottom:1px solid #344256}h1{margin:0 16px 0 0;font-size:18px}button,.filelabel{background:#2b394c;color:#e9eef6;border:1px solid #435670;border-radius:7px;padding:9px 11px;cursor:pointer;font-size:13px}button.active{background:#2563eb;border-color:#60a5fa}button:hover,.filelabel:hover{background:#3b4e66}.filelabel input{display:none}main{display:flex;height:calc(100vh - 110px);min-height:450px}#stage{min-width:0;flex:1;position:relative}canvas{display:block;width:100%;height:100%;cursor:crosshair}aside{width:235px;background:#161f2b;border-left:1px solid #344256;padding:14px;overflow:auto;font-size:13px}aside h2{font-size:14px;margin:0 0 14px}aside dt{color:#94a3b8;margin-top:13px}aside dd{margin:4px 0 0;overflow-wrap:anywhere}footer{padding:9px 14px;background:#1c2531;border-top:1px solid #344256;font-size:12px;color:#b6c6da;min-height:40px}#hint{position:absolute;top:12px;left:12px;background:#1e293bd9;border-radius:6px;padding:9px;font-size:12px;color:#c7d5e9;pointer-events:none}.note{color:#fbbf24;line-height:1.6;font-size:12px;margin-top:20px}@media(max-width:700px){aside{width:165px}main{height:calc(100vh - 155px)}header{gap:5px}button,.filelabel{padding:7px}}
</style></head><body><header><h1>MiniCAD <span style="color:#60a5fa">Web</span></h1><label class="filelabel">📂 DWG / DXF 열기<input id="file" type="file" accept=".dwg,.dxf"></label><button data-mode="select" class="active">선택</button><button data-mode="measure">거리 측정</button><button data-mode="line">선 추가</button><button data-mode="move">이동</button><button id="del">삭제</button><button id="fit">전체 보기</button><button id="saveDxf">DXF 저장</button><button id="saveDwg">DWG 저장</button></header><main><div id="stage"><canvas id="cv"></canvas><div id="hint">휠: 확대/축소 · 우클릭 드래그: 화면 이동 · 측정/선 추가: 두 점 클릭 · ESC: 취소</div></div><aside><h2>도면 정보</h2><dl><dt>파일</dt><dd id="filename">샘플 도면</dd><dt>전체 객체</dt><dd id="count">-</dd><dt>선택한 객체</dt><dd id="selected">없음</dd><dt>측정 거리</dt><dd id="distance">-</dd><dt>도면 단위</dt><dd id="unit">-</dd><dt>미지원 객체</dt><dd id="unsupported">-</dd><dt>DWG 변환</dt><dd id="oda">확인 중</dd></dl><p class="note">1차 시험 버전: LINE, CIRCLE, ARC, LWPOLYLINE, POINT를 표시합니다. 미지원 객체와 곡선 폴리라인은 정확한 화면 재현을 보장하지 않습니다. 원본 파일은 별도로 보관하세요.</p></aside></main><footer id="status">시작하려면 DWG 또는 DXF 파일을 여세요. 시험용 샘플 도면이 표시됩니다.</footer><script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');let entities=[],mode='select',scale=2,origin={x:150,y:450},selected=null,pending=null,drag=null,filename='샘플',changed=false;const sample=[{id:'s1',type:'LINE',a:[0,0],b:[200,0],layer:'0'},{id:'s2',type:'LINE',a:[200,0],b:[200,100],layer:'0'},{id:'s3',type:'LINE',a:[200,100],b:[0,100],layer:'0'},{id:'s4',type:'LINE',a:[0,100],b:[0,0],layer:'0'},{id:'s5',type:'CIRCLE',c:[100,50],r:25,layer:'0'}];entities=sample;
const toS=p=>({x:origin.x+p[0]*scale,y:origin.y-p[1]*scale});const toW=p=>[(p.x-origin.x)/scale,(origin.y-p.y)/scale];const norm=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);const fmt=n=>Number(n.toFixed(4)).toString();
function resize(){let r=stage.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*devicePixelRatio));cv.height=Math.max(1,Math.round(r.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}new ResizeObserver(resize).observe(stage);
function arcPoints(e){let a=e.start*Math.PI/180,b=e.end*Math.PI/180;if(b<=a)b+=Math.PI*2;let out=[];for(let i=0;i<=72;i++){let t=a+(b-a)*i/72;out.push([e.c[0]+e.r*Math.cos(t),e.c[1]+e.r*Math.sin(t)])}return out}
function paths(e){if(e.type==='LINE')return [[e.a,e.b]];if(e.type==='LWPOLYLINE'){const p=[...(e.pts||[])];if(e.closed&&p.length)p.push(p[0]);return [p]};if(e.type==='ARC')return [arcPoints(e)];if(e.type==='CIRCLE'){let p=[];for(let i=0;i<=100;i++){const t=2*Math.PI*i/100;p.push([e.c[0]+e.r*Math.cos(t),e.c[1]+e.r*Math.sin(t)])}return [p]};if(e.type==='POINT')return [[e.c]];return []}
function draw(){const w=cv.width/devicePixelRatio,h=cv.height/devicePixelRatio;ctx.fillStyle='#101923';ctx.fillRect(0,0,w,h);const step=scale>8?10:scale>1?50:scale>.2?250:1000;ctx.strokeStyle='#233243';ctx.lineWidth=.6;let a=toW({x:0,y:h}),b=toW({x:w,y:0});if((b[0]-a[0])/step<250)for(let x=Math.floor(a[0]/step)*step;x<=b[0];x+=step){let z=toS([x,0]);ctx.beginPath();ctx.moveTo(z.x,0);ctx.lineTo(z.x,h);ctx.stroke()}if((b[1]-a[1])/step<250)for(let y=Math.floor(a[1]/step)*step;y<=b[1];y+=step){let z=toS([0,y]);ctx.beginPath();ctx.moveTo(0,z.y);ctx.lineTo(w,z.y);ctx.stroke()}
for(const e of entities){ctx.strokeStyle=e.id===selected?'#f9b84a':'#66d5e7';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=e.id===selected?2.5:1.35;for(let path of paths(e)){if(!path.length)continue;ctx.beginPath();let p=toS(path[0]);ctx.moveTo(p.x,p.y);if(path.length===1){ctx.arc(p.x,p.y,2.5,0,2*Math.PI);ctx.fill()}else{for(let i=1;i<path.length;i++){p=toS(path[i]);ctx.lineTo(p.x,p.y)}ctx.stroke()}}}
if(pending){let p=toS(pending);ctx.beginPath();ctx.fillStyle='#facc15';ctx.arc(p.x,p.y,4,0,2*Math.PI);ctx.fill()}}
function fit(){let pts=[];for(let e of entities)for(let p of paths(e))pts.push(...p);if(!pts.length)return;let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),w=stage.clientWidth,h=stage.clientHeight;scale=Math.min((w-80)/Math.max(1,mxx-mnx),(h-80)/Math.max(1,mxy-mny));scale=Math.max(.00001,Math.min(scale,50000));origin={x:w/2-(mnx+mxx)/2*scale,y:h/2+(mny+mxy)/2*scale};draw()}
function segmentDist(p,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],d=dx*dx+dy*dy,t=d?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/d)):0;return norm(p,[a[0]+t*dx,a[1]+t*dy])}
function pick(p){let best=null,d=10/scale;for(let e of entities){for(let path of paths(e)){for(let i=1;i<path.length;i++){let k=segmentDist(p,path[i-1],path[i]);if(k<d){d=k;best=e.id}}}}return best}
function snap(p){let best=p,d=10/scale;for(let e of entities)for(let path of paths(e)){let candidates=[...path.slice(0,Math.min(path.length,2))];if(e.type==='LINE')candidates.push([(e.a[0]+e.b[0])/2,(e.a[1]+e.b[1])/2]);if(e.type==='CIRCLE'||e.type==='ARC')candidates.push(e.c);for(let q of candidates){let k=norm(p,q);if(k<d){best=q;d=k}}}return best}
function cursor(ev){let r=cv.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}}
cv.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('pointerdown',e=>{if(e.button===2||e.button===1){drag={at:cursor(e),origin:{...origin}};cv.setPointerCapture(e.pointerId)}});cv.addEventListener('pointermove',e=>{if(drag){let p=cursor(e);origin={x:drag.origin.x+p.x-drag.at.x,y:drag.origin.y+p.y-drag.at.y};draw()}else{let p=toW(cursor(e));$('status').textContent=`좌표 X ${fmt(p[0])}, Y ${fmt(p[1])} · ${mode==='measure'?'두 점을 클릭해 거리를 측정하세요':mode==='line'?'두 점을 클릭해 선을 추가하세요':mode==='move'?'객체를 클릭하고 이동할 위치를 클릭하세요':'객체를 클릭해 선택하세요'}`}});cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('click',async e=>{if(e.button!==0||drag)return;let p=snap(toW(cursor(e)));if(mode==='select'){selected=pick(p);$('selected').textContent=selected||'없음'}else if(mode==='measure'){if(!pending)pending=p;else{$('distance').textContent=fmt(norm(pending,p))+' (도면 단위)';pending=null}}else if(mode==='line'){if(!pending)pending=p;else{await edit({op:'add_line',x1:pending[0],y1:pending[1],x2:p[0],y2:p[1]});pending=null}}else if(mode==='move'){if(!selected){selected=pick(p);if(selected)pending=p}else if(pending){await edit({op:'move',handle:selected,dx:p[0]-pending[0],dy:p[1]-pending[1]});pending=null;selected=null}}draw()});cv.addEventListener('wheel',e=>{e.preventDefault();let p=cursor(e),world=toW(p),f=Math.exp(-e.deltaY*.0015);scale=Math.max(.00001,Math.min(scale*f,100000));origin={x:p.x-world[0]*scale,y:p.y+world[1]*scale};draw()},{passive:false});
function setMode(m){mode=m;pending=null;selected=null;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('selected').textContent='없음';draw()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.addEventListener('keydown',e=>{if(e.key==='Escape'){pending=null;selected=null;draw()}if(e.key==='Delete'&&selected)$('del').click()});$('fit').onclick=fit;
function update(data){entities=data.entities||[];$('count').textContent=`${data.total||0} (표시 ${entities.length})`;$('unsupported').textContent=Object.entries(data.unsupported||{}).map(([k,v])=>k+': '+v).join(', ')||'없음';const u={0:'미지정',1:'인치',2:'피트',4:'mm',5:'cm',6:'m'};$('unit').textContent=u[data.units]||'코드 '+data.units;draw()}
async function edit(data){try{const r=await fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.detail||'수정 실패');update(v);changed=true}catch(e){alert(e.message)}}$('del').onclick=async()=>{if(!selected){alert('먼저 객체를 선택하세요.');return}await edit({op:'delete',handle:selected});selected=null;draw()};
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let data=new FormData();data.append('file',f);$('status').textContent='도면 불러오는 중...';try{const r=await fetch('/api/open',{method:'POST',body:data});const v=await r.json();if(!r.ok)throw Error(v.detail||'열기 실패');filename=f.name;$('filename').textContent=f.name;selected=null;pending=null;update(v);fit();changed=false;$('status').textContent=f.name+' 불러오기 완료'}catch(err){alert(err.message);$('status').textContent='파일 열기 실패'}};
async function save(fmt){try{let r=await fetch('/api/export/'+fmt);if(!r.ok){let j=await r.json();throw Error(j.detail||'저장 실패')}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(filename.replace(/\.(dwg|dxf)$/i,'')||'drawing')+'_edited.'+fmt;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(err){alert(err.message)}}$('saveDxf').onclick=()=>save('dxf');$('saveDwg').onclick=()=>save('dwg');fetch('/api/status').then(r=>r.json()).then(x=>$('oda').textContent=x.oda_installed?'설치 확인됨':'설치 필요').catch(()=>$('oda').textContent='서버 연결 안 됨');$('filename').textContent='예제 도면 (저장하려면 실제 파일 열기)';fit();
</script></body></html>
